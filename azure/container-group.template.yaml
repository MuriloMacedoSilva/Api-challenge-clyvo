apiVersion: '2021-10-01'
location: __AZURE_LOCATION__
name: __ACI_NAME__
properties:
  containers:
    - name: clyvo-api
      properties:
        image: __API_IMAGE__
        ports:
          - port: 8080
            protocol: TCP
        environmentVariables:
          - name: SPRING_PROFILES_ACTIVE
            value: prod
          - name: DB_URL
            value: __DB_URL__
          - name: DB_USERNAME
            secureValue: __POSTGRES_USER__
          - name: DB_PASSWORD
            secureValue: __POSTGRES_PASSWORD__
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 1.5
        livenessProbe:
          httpGet:
            path: /tutor/ping
            port: 8080
            scheme: Http
          initialDelaySeconds: 60
          periodSeconds: 20
          failureThreshold: 5
    - name: clyvo-postgres
      properties:
        image: __POSTGRES_IMAGE__
        ports:
          - port: 5432
            protocol: TCP
        environmentVariables:
          - name: POSTGRES_DB
            value: __POSTGRES_DB__
          - name: POSTGRES_USER
            secureValue: __POSTGRES_USER__
          - name: POSTGRES_PASSWORD
            secureValue: __POSTGRES_PASSWORD__
        resources:
          requests:
            cpu: 1.0
            memoryInGB: 2.0
  imageRegistryCredentials:
    - server: __ACR_SERVER__
      username: __ACR_USERNAME__
      password: __ACR_PASSWORD__
  ipAddress:
    type: Public
    dnsNameLabel: __DNS_NAME_LABEL__
    autoGeneratedDomainNameLabelScope: ResourceGroupReuse
    ports:
      - protocol: TCP
        port: 8080
  osType: Linux
  restartPolicy: Always
tags:
  application: clyvo
  environment: academic-demo
type: Microsoft.ContainerInstance/containerGroups
