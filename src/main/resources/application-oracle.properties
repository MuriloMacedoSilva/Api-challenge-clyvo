spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${ORACLE_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${ORACLE_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${ORACLE_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${ORACLE_IDLE_TIMEOUT_MS:300000}
spring.datasource.hikari.max-lifetime=${ORACLE_MAX_LIFETIME_MS:1500000}
spring.datasource.hikari.initialization-fail-timeout=${ORACLE_INITIALIZATION_FAIL_TIMEOUT_MS:10000}
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=${ORACLE_CONNECT_TIMEOUT_MS:10000}
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=${ORACLE_READ_TIMEOUT_MS:30000}

spring.sql.init.mode=never
spring.h2.console.enabled=false
