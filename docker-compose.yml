services:
  postgres:
    image: postgres:16
    container_name: clyvo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clyvo}
      POSTGRES_USER: ${POSTGRES_USER:-clyvo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clyvo}
    ports:
      - "5432:5432"
    volumes:
      - clyvo-postgres-data:/var/lib/postgresql/data
      - ./demo-data.sql:/seed/demo-data.sql:ro
      - ./demo-data-postgres.sql:/seed/demo-data-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clyvo-postgres-data:
